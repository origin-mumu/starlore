name: Deploy to Server

on:
  push:
    branches: [main]
    paths:
      - "starlore-front/**"
      - "starlore-admin/**"
      - "starlore-py/**"
      - "docker-compose.yml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      build_all:
        description: 'Force build and deploy all services'
        required: false
        default: true
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detect changed services
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            front:
              - 'starlore-front/**'
              - '.github/workflows/deploy.yml'
            admin:
              - 'starlore-admin/**'
              - '.github/workflows/deploy.yml'
            py:
              - 'starlore-py/**'
              - '.github/workflows/deploy.yml'
            stack:
              - 'docker-compose.yml'
              - '.github/workflows/deploy.yml'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push starlore-front
        if: steps.changes.outputs.front == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v6
        with:
          context: ./starlore-front
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/starlore-front:latest

      - name: Build and Push starlore-admin
        if: steps.changes.outputs.admin == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v6
        with:
          context: ./starlore-admin
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/starlore-admin:latest

      - name: Build and Push starlore-py
        if: steps.changes.outputs.py == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v6
        with:
          context: ./starlore-py
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/starlore-py:latest
          cache-from: type=gha,scope=starlore-py
          cache-to: type=gha,mode=max,scope=starlore-py

      - name: Copy docker-compose.yml to server
        if: steps.changes.outputs.stack == 'true' || github.event_name == 'workflow_dispatch'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "docker-compose.yml"
          target: "/opt/starlore"

      - name: Deploy to Server
        if: steps.changes.outputs.front == 'true' || steps.changes.outputs.admin == 'true' || steps.changes.outputs.py == 'true' || steps.changes.outputs.stack == 'true' || github.event_name == 'workflow_dispatch'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 60m
          script: |
            cd /opt/starlore
            if [ "${{ steps.changes.outputs.stack }}" = "true" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              docker-compose pull
              docker-compose up -d --remove-orphans
            else
              if [ "${{ steps.changes.outputs.py }}" = "true" ]; then
                docker-compose pull starlore-py
                docker-compose up -d --no-deps starlore-py
              fi
              if [ "${{ steps.changes.outputs.front }}" = "true" ]; then
                docker-compose pull starlore-front
                docker-compose up -d --no-deps starlore-front
              fi
              if [ "${{ steps.changes.outputs.admin }}" = "true" ]; then
                docker-compose pull starlore-admin
                docker-compose up -d --no-deps starlore-admin
              fi
            fi
            # Keep recent layers for rollback and cache reuse.
            docker image prune -f --filter "until=168h"
