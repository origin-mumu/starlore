name: Deploy to Server

on:
  push:
    branches: [main]
    paths:
      - "starlore-front/**"
      - "starlore-back/**"
      - "docker-compose.yml"
      - ".github/workflows/deploy.yml"

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detect changed services
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            front:
              - 'starlore-front/**'
            back:
              - 'starlore-back/**'
            stack:
              - 'docker-compose.yml'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push starlore-front
        if: steps.changes.outputs.front == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./starlore-front
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/starlore-front:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push starlore-back
        if: steps.changes.outputs.back == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./starlore-back
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/starlore-back:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Copy docker-compose.yml to server
        if: steps.changes.outputs.stack == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "docker-compose.yml"
          target: "/opt/starlore"

      - name: Deploy to Server
        if: steps.changes.outputs.front == 'true' || steps.changes.outputs.back == 'true' || steps.changes.outputs.stack == 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 60m
          script: |
            cd /opt/starlore
            if [ "${{ steps.changes.outputs.stack }}" = "true" ]; then
              docker-compose pull
              docker-compose up -d --remove-orphans
            else
              if [ "${{ steps.changes.outputs.back }}" = "true" ]; then
                docker-compose pull starlore-back
                docker-compose up -d --no-deps starlore-back
              fi
              if [ "${{ steps.changes.outputs.front }}" = "true" ]; then
                docker-compose pull starlore-front
                docker-compose up -d --no-deps starlore-front
              fi
            fi
            # Keep recent layers for rollback and cache reuse.
            docker image prune -f --filter "until=168h"
