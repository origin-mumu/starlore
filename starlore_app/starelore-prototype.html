<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Starelore · 星语治愈</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* 治愈系大地配色 */
        :root {
            --bg-base: #F4F1ED;         /* 暖米色背景 */
            --accent-green: #7A8B76;    /* 鼠尾草绿 */
            --accent-orange: #D48C70;   /* 陶土橘 */
            --text-dark: #333333;       /* 柔和的深灰，非纯黑 */
            --text-light: #8B8B8B;
            --glass-bg: rgba(255, 255, 255, 0.6);
            --glass-border: rgba(255, 255, 255, 0.8);
            --radius-lg: 32px;
            --radius-md: 24px;
            --radius-sm: 16px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
        }

        body {
            background-color: #E8E5E1;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-dark);
        }

        /* 模拟手机容器及背后的背景氛围色块（用来凸显毛玻璃） */
        .phone-wrapper {
            position: relative;
            width: 100%;
            max-width: 375px;
            height: 812px;
            border-radius: 40px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            background-color: var(--bg-base);
        }

        /* 纯 CSS 绘制的背景柔和色块 */
        .bg-blob-1 {
            position: absolute;
            top: -50px;
            right: -50px;
            width: 250px;
            height: 250px;
            background: var(--accent-green);
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.3;
        }

        .bg-blob-2 {
            position: absolute;
            bottom: 100px;
            left: -80px;
            width: 300px;
            height: 300px;
            background: var(--accent-orange);
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.2;
        }

        /* 真实的 App 容器（毛玻璃材质） */
        .app-container {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        /* 头部区域 */
        .header {
            padding: 50px 24px 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .header p {
            font-size: 14px;
            color: var(--text-light);
            margin-top: 6px;
        }

        .profile-img {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-green) 0%, var(--accent-orange) 100%);
            border: 2px solid white;
            box-shadow: 0 8px 16px rgba(0,0,0,0.06);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        /* 内容滑动区 */
        .content {
            padding: 0 24px;
            flex: 1;
            overflow-y: auto;
        }

        /* 隐藏滚动条 */
        .content::-webkit-scrollbar {
            display: none;
        }

        /* 数据概览卡片 - 极致毛玻璃 */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 16px 32px rgba(0, 0, 0, 0.04);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 24px;
            font-weight: 600;
            color: var(--accent-green);
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-light);
            margin-top: 4px;
        }

        .divider {
            width: 1px;
            height: 40px;
            background: rgba(0,0,0,0.06);
        }

        /* 列表区域 */
        .section-header {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 16px;
        }

        /* 列表项卡片 */
        .item-card {
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-md);
            padding: 16px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.03);
            transition: transform 0.3s ease;
            cursor: pointer;
        }

        .item-card:hover {
            transform: scale(1.02);
            background: rgba(255, 255, 255, 0.9);
        }

        .item-icon {
            width: 64px;
            height: 64px;
            border-radius: var(--radius-sm);
            background-color: #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            background: linear-gradient(135deg, rgba(122, 139, 118, 0.2) 0%, rgba(212, 140, 112, 0.15) 100%);
        }

        .item-info {
            flex: 1;
        }

        .item-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .item-desc {
            font-size: 13px;
            color: var(--text-light);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }
        .dot-green { background-color: var(--accent-green); }
        .dot-orange { background-color: var(--accent-orange); }

        /* 星座分数标签 */
        .score-tag {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            background: rgba(122, 139, 118, 0.15);
            color: var(--accent-green);
        }

        .score-tag.high {
            background: rgba(212, 140, 112, 0.15);
            color: var(--accent-orange);
        }

        /* 悬浮底部导航 - 胶囊型毛玻璃 */
        .bottom-nav-container {
            position: absolute;
            bottom: 30px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            z-index: 20;
        }

        .bottom-nav {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.8);
            border-radius: 100px;
            padding: 12px 24px;
            display: flex;
            gap: 32px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
        }

        .nav-item {
            color: var(--text-light);
            font-size: 20px;
            cursor: pointer;
            transition: color 0.3s;
            padding: 8px;
        }

        .nav-item.active {
            color: var(--accent-green);
        }
    </style>
</head>
<body>

    <div class="phone-wrapper">
        <!-- 背景模糊色块 -->
        <div class="bg-blob-1"></div>
        <div class="bg-blob-2"></div>

        <!-- App 主体内容 -->
        <div class="app-container">

            <header class="header">
                <div>
                    <h1>早安，星语者 ✨</h1>
                    <p>今日星辰为你闪耀</p>
                </div>
                <div class="profile-img">🌟</div>
            </header>

            <main class="content">
                <!-- 毛玻璃数据卡片 -->
                <div class="glass-card">
                    <div class="stat-item">
                        <div class="stat-value">92</div>
                        <div class="stat-label">今日运势</div>
                    </div>
                    <div class="divider"></div>
                    <div class="stat-item">
                        <div class="stat-value" style="color: var(--accent-orange);">狮子</div>
                        <div class="stat-label">星座</div>
                    </div>
                    <div class="divider"></div>
                    <div class="stat-item">
                        <div class="stat-value">87%</div>
                        <div class="stat-label">匹配度</div>
                    </div>
                </div>

                <h2 class="section-header">今日星象</h2>

                <!-- 列表项 -->
                <div class="item-card">
                    <div class="item-icon">♌</div>
                    <div class="item-info">
                        <div class="item-title">狮子座运势</div>
                        <div class="item-desc">
                            <span class="status-dot dot-orange"></span>
                            爱情运势上升中
                        </div>
                    </div>
                    <span class="score-tag high">9.2</span>
                </div>

                <div class="item-card">
                    <div class="item-icon">♏</div>
                    <div class="item-info">
                        <div class="item-title">天蝎座运势</div>
                        <div class="item-desc">
                            <span class="status-dot dot-green"></span>
                            贵人运旺盛
                        </div>
                    </div>
                    <span class="score-tag">8.8</span>
                </div>

                <div class="item-card">
                    <div class="item-icon">♐</div>
                    <div class="item-info">
                        <div class="item-title">射手座运势</div>
                        <div class="item-desc">
                            <span class="status-dot dot-green"></span>
                            创造力爆发
                        </div>
                    </div>
                    <span class="score-tag">9.4</span>
                </div>

                <!-- 占位空隙，防止内容被底部导航挡住 -->
                <div style="height: 100px;"></div>
            </main>

            <!-- 悬浮胶囊导航 -->
            <div class="bottom-nav-container">
                <nav class="bottom-nav">
                    <div class="nav-item active"><i class="fa-solid fa-star"></i></div>
                    <div class="nav-item"><i class="fa-solid fa-magnifying-glass"></i></div>
                    <div class="nav-item"><i class="fa-regular fa-comment"></i></div>
                    <div class="nav-item"><i class="fa-regular fa-user"></i></div>
                </nav>
            </div>

        </div>
    </div>

</body>
</html>
