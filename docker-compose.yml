services:
  # ---- 基础设施 ----
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: starlore
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql

  minio:
    image: minio/minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data

  # ---- 应用服务 ----
  starlore-back:
    image: ghcr.io/origin-mumu/starlore/starlore-back:latest
    restart: unless-stopped
    ports:
      - "8081:5000"
    depends_on:
      mysql:
        condition: service_started
      minio:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/starlore?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      APP_JWT_SECRET: ${JWT_SECRET}
      APP_MINIO_ENDPOINT: http://minio:9000
      APP_MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      APP_MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      APP_MINIO_BUCKET: ${MINIO_BUCKET}
      SPRING_AI_OPENAI_BASE_URL: ${AI_API_URL}
      SPRING_AI_OPENAI_CHAT_OPTIONS_MODEL: ${AI_MODEL}
      LANGCHAIN_API_KEY: ${LANGCHAIN_API_KEY:-}

  starlore-front:
    image: ghcr.io/origin-mumu/starlore/starlore-front:latest
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - starlore-back

  starlore-pdf:
    image: ghcr.io/origin-mumu/starlore/starlore-pdf:latest
    restart: unless-stopped
    ports:
      - "3001:3001"

volumes:
  mysql_data:
  minio_data:
