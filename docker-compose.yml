services:
  # ---- 应用服务 ----
  # Java 后端
  starlore-back:
    image: ghcr.io/origin-mumu/starlore/starlore-back:latest
    restart: unless-stopped
    depends_on:
      - minio
    environment:
      # 数据库连接：使用环境变量，指向宿主机上的宝塔 MySQL (默认网关 172.17.0.1，库名 ro-blog)
      - SPRING_DATASOURCE_URL=jdbc:mysql://${DB_HOST:-172.17.0.1}:3306/${DB_NAME:-ro-blog}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false&autoReconnect=true
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      # MinIO 配置
      - APP_MINIO_ENDPOINT=http://minio:9000
      - APP_MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - APP_MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - APP_MINIO_BUCKET=${MINIO_BUCKET}
      # AI 配置
      - SPRING_AI_OPENAI_BASE_URL=${AI_API_URL}
      - SPRING_AI_OPENAI_CHAT_OPTIONS_MODEL=${AI_MODEL}
      # JWT 配置
      - APP_JWT_SECRET=${JWT_SECRET}
      # LangSmith 配置
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY:-}

  # MinIO 对象存储
  minio:
    image: minio/minio
    restart: unless-stopped
    ports:
      - "9000:9000"  # 外部/浏览器直传使用
      - "9001:9001"  # 控制台后台管理
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY}
    volumes:
      # 支持从环境文件传入原有宝塔 MinIO 的宿主机挂载目录，默认使用命名卷
      - ${MINIO_DATA_PATH:-minio_data}:/data
    command: server /data --console-address ":9001"

  # 前端
  starlore-front:
    image: ghcr.io/origin-mumu/starlore/starlore-front:latest
    restart: unless-stopped
    ports:
      - "5173:80"  # 必须暴露，用于宝塔 Nginx 做反向代理
    depends_on:
      - starlore-back

  # PDF 服务
  starlore-pdf:
    image: ghcr.io/origin-mumu/starlore/starlore-pdf:latest
    restart: unless-stopped
    ports:
      - "3001:3001"  # 必须暴露，用于服务调用/直接访问

volumes:
  minio_data:
