services:
  # ---- 应用服务 ----
  # Python 统一 AI 核心后端
  starlore-py:
    image: ghcr.io/origin-mumu/starlore/starlore-py:latest
    restart: unless-stopped
    ports:
      - "5000:5000"
      - "5001:5000"
    depends_on:
      - minio
    volumes:
      - starlore_py_data:/app/data
    environment:
      - DB_HOST=${DB_HOST:-172.17.0.1}
      - DB_PORT=3306
      - DB_NAME=${DB_NAME:-ro-blog}
      - DB_USER=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_BUCKET=${MINIO_BUCKET}
      - MINIO_PUBLIC_URL=https://www.starlore.cn/minio/my-files
      - PDF_SERVICE_URL=http://172.17.0.1:3001
      - ZHIPU_API_KEY=${ZHIPU_API_KEY:-}

  # MinIO 对象存储
  minio:
    image: minio/minio
    restart: unless-stopped
    ports:
      - "9000:9000"  # 外部/浏览器直传使用
      - "9001:9001"  # 控制台后台管理
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY}
    volumes:
      # 支持从环境文件传入原有宝塔 MinIO 的宿主机挂载目录，默认使用命名卷
      - ${MINIO_DATA_PATH:-minio_data}:/data
    command: server /data --console-address ":9001"

  # 前端
  starlore-front:
    image: ghcr.io/origin-mumu/starlore/starlore-front:latest
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - starlore-py

  # 管理后台（仅管理员使用，建议外层 Nginx 做访问限制）
  starlore-admin:
    image: ghcr.io/origin-mumu/starlore/starlore-admin:latest
    restart: unless-stopped
    ports:
      - "5174:80"
    depends_on:
      - starlore-py

volumes:
  minio_data:
  starlore_py_data:
