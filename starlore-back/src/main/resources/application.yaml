server:
  port: 5000
  forward-headers-strategy: framework
  tomcat:
    max-http-form-post-size: 10MB
    max-swallow-size: 10MB
    connection-timeout: 120s
  max-http-request-header-size: 64KB

spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  profiles:
    active: dev,local
  application:
    name: blog-back
  datasource:
    username: ${SPRING_DATASOURCE_USERNAME:your_db_username}
    password: ${SPRING_DATASOURCE_PASSWORD:your_db_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      keepalive-time: 30000
      max-lifetime: 600000
      idle-timeout: 300000
      connection-timeout: 10000
      validation-timeout: 5000
      maximum-pool-size: 10
      minimum-idle: 2
  jackson:
    date-format: "yyyy-MM-dd'T'HH:mm:ss.SSS'Z'"
    time-zone: "Asia/Shanghai"
  mvc:
    async:
      request-timeout: 120000
  ai:
    openai:
      api-key:
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-chat

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
  type-handlers-package: com.robin.blogback.config

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}

langsmith:
  tracing:
    enabled: true
  api-key: ${LANGCHAIN_API_KEY:}
  project: starlore-java
  endpoint: https://api.smith.langchain.com

app:
  agent:
    executor:
      core-size: ${AGENT_EXECUTOR_CORE_SIZE:4}
      max-size: ${AGENT_EXECUTOR_MAX_SIZE:8}
      queue-capacity: ${AGENT_EXECUTOR_QUEUE_CAPACITY:64}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  jwt:
    secret: ${APP_JWT_SECRET:your_jwt_secret}
    expiration: 604800000
  minio:
    endpoint: ${APP_MINIO_ENDPOINT:http://your_minio_host:9000}
    public-url: ${APP_MINIO_PUBLIC_URL:https://your_minio_domain/minio}
    access-key: ${APP_MINIO_ACCESS_KEY:your_minio_access_key}
    secret-key: ${APP_MINIO_SECRET_KEY:your_minio_secret_key}
    bucket: ${APP_MINIO_BUCKET:your_minio_bucket}
